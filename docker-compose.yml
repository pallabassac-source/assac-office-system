services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assac_backend_api
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      TZ: Asia/Kolkata
      DB_DIR: /app/data
      UPLOADS_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET:-assac_production_super_secret_key_2026}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - assac_data:/app/data
      - assac_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - assac_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assac_frontend_ui
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - assac_network

volumes:
  assac_data:
    name: assac_data
  assac_uploads:
    name: assac_uploads

networks:
  assac_network:
    name: assac_network
    driver: bridge
